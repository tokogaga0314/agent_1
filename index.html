<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>歡迎頁</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --bg2: #1e293b;
        --card: rgba(15, 23, 42, 0.72);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent2: #818cf8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.35), transparent 34%),
          radial-gradient(circle at bottom right, rgba(129, 140, 248, 0.28), transparent 30%),
          linear-gradient(160deg, var(--bg), var(--bg2));
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(100%, 560px);
        padding: 40px 32px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        background: var(--card);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: #7dd3fc;
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2rem, 6vw, 3.4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto;
        max-width: 32rem;
        color: var(--muted);
        line-height: 1.8;
        font-size: 1rem;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
        padding: 12px 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .primary {
        color: #08111f;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.24);
      }

      .secondary {
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.35);
      }

      a:hover {
        transform: translateY(-1px);
      }

      .footer {
        margin-top: 24px;
        font-size: 0.9rem;
        color: rgba(148, 163, 184, 0.8);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="歡迎頁主內容">
      <div class="badge">✨ Simple Welcome Page</div>
      <h1>歡迎來到 agent_1</h1>
      <p>
        這是一個簡單、乾淨、響應式的歡迎頁。
        你可以把它當作專案首頁、測試頁，或之後再接上更多內容。
      </p>
      <div class="actions">
        <a class="primary" href="#">開始使用</a>
        <a class="secondary" href="#">了解更多</a>
      </div>
      <div class="footer">Made for Gagaga</div>
    </main>
  </body>
</html>
